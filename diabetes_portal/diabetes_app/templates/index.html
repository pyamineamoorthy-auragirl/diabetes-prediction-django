<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Diabetes Risk Analyzer</title>
</head>
<body class="bg-slate-900 text-slate-100 p-6">
    <div class="max-w-3xl mx-auto bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        <h2 class="text-3xl font-bold mb-2 text-emerald-400">Health Check Portal</h2>
        <p class="text-slate-400 mb-8 italic">Diagnostic Prediction System for LG-YAM Team</p>

        {% if error %}
        <div class="bg-red-900/50 border border-red-500 text-red-200 p-3 rounded-lg mb-6">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-semibold mb-1">Pregnancies</label>
                <input type="number" name="pregnancies" placeholder="0" class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Glucose Level</label>
                <input type="number" name="glucose" placeholder="e.g. 120" required class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Blood Pressure</label>
                <input type="number" name="bp" placeholder="e.g. 80" class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Skin Thickness (mm)</label>
                <input type="number" name="skin" placeholder="e.g. 20" class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Insulin Level</label>
                <input type="number" name="insulin" placeholder="e.g. 80" class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">BMI (Weight/Height²)</label>
                <input type="number" step="0.1" name="bmi" placeholder="e.g. 26.2" required class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Pedigree Function</label>
                <input type="number" step="0.001" name="dpf" placeholder="e.g. 0.45" required class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Age</label>
                <input type="number" name="age" placeholder="e.g. 30" required class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div class="md:col-span-2 mt-4">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-900/20">
                    Run Diagnostic Analysis
                </button>
            </div>
        </form>
    </div>
</body>
</html>
